[project]
name = "allfina-ai-service"
version = "0.1.0"
description = "AllFina internal AI service: transcription and meeting analysis"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1,<2",
    "fastapi[standard]>=0.116",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
